<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discord Voice Quick Callouts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="channel-badge" id="channelBadge">
        <span class="status-dot"></span>
        <span id="connectedChannelName">Chưa kết nối Voice</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnConnectVoice" title="Chọn Kênh Voice">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button class="icon-btn" id="btnManagePresets" title="Quản lý Nút Bấm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="section-header">
        <h2>QUICK CALLOUTS</h2>
        <span class="sub-tag" id="presetCount">12 câu phát nhanh</span>
      </div>

      <!-- Quick Callouts Grid -->
      <div class="callouts-grid" id="calloutsGrid">
        <!-- Rendered dynamically by app.js -->
      </div>

      <!-- Custom Speech Input Section -->
      <div class="custom-tts-card">
        <div class="card-title">
          <span>GÕ CÂU TỰ DO (TTS)</span>
          <div class="voice-selector">
            <select id="voiceSelect">
              <option value="vi-VN-NamMinhNeural">Giọng Nam (Nam Minh)</option>
              <option value="vi-VN-HoaiMyNeural">Giọng Nữ (Hoài Mỹ)</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <input type="text" id="customTextInput" placeholder="Nhập câu muốn bot phát giọng..." autocomplete="off">
          <button id="btnSendCustomText" class="send-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Quản lý / Thêm / Sửa Quick Callouts -->
  <div class="modal-overlay" id="presetModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Thêm Quick Callout Mới</h3>
        <button class="close-btn" id="btnCloseModal">&times;</button>
      </div>
      <form id="presetForm">
        <input type="hidden" id="editPresetId">
        <div class="form-group">
          <label>Nhãn hiển thị trên nút (Label):</label>
          <input type="text" id="presetLabelInput" placeholder="Ví dụ: Top mất tích" required>
        </div>
        <div class="form-group">
          <label>Câu đọc TTS (Nội dung đọc vào Discord):</label>
          <input type="text" id="presetTextInput" placeholder="Ví dụ: Top mất tích rồi anh em cẩn thận!" required>
        </div>
        <div class="form-row">
          <div class="form-group half">
            <label>Icon (Emoji):</label>
            <input type="text" id="presetIconInput" placeholder="👁️" value="🎯">
          </div>
          <div class="form-group half">
            <label>Màu sắc (Accent Color):</label>
            <input type="color" id="presetColorInput" value="#f97316">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-danger" id="btnDeletePreset" style="display: none;">Xóa Nút</button>
          <button type="submit" class="btn-primary">Lưu Nút Bấm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Chọn Kênh Voice Discord -->
  <div class="modal-overlay" id="voiceModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Chọn Kênh Voice Discord</h3>
        <button class="close-btn" id="btnCloseVoiceModal">&times;</button>
      </div>
      <div class="voice-modal-body">
        <div class="form-group">
          <label>Chọn Server (Guild):</label>
          <select id="guildSelect">
            <option value="">Đang tải danh sách server...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Chọn Kênh Voice:</label>
          <select id="channelSelect">
            <option value="">Vui lòng chọn server trước</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btnDisconnectVoiceChannel">Ngắt Kết Nối Voice</button>
          <button type="button" class="btn-primary" id="btnConfirmVoiceConnect">Kết Nối Kênh</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
